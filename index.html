<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Personal homepage">
  <meta name="theme-color" content="#fafafa">
  <title>Personal homepage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="profile.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="nav-toggle" aria-expanded="false" aria-controls="site-nav"><span aria-hidden="true">☰</span> <span data-i18n="navigation">Navigation</span></button>
      <nav id="site-nav" class="site-nav" aria-label="Page sections">
        <a href="#profile" data-i18n="overview" aria-current="location">Homepage</a>
        <a href="#about" data-i18n="about">About</a>
        <a href="#news" data-i18n="news">News</a>
        <a href="#projects" data-i18n="projects">Projects</a>
        <a href="#background" data-i18n="background">Education</a>
        <a href="#experience" data-i18n="experience">Experience</a>
      </nav>
      <label class="language-control"><span class="sr-only" data-i18n="language">Language</span>
        <select id="language-select"><option value="en" lang="en">English</option><option value="zh" lang="zh-CN">中文</option><option value="de" lang="de">Deutsch</option></select>
      </label>
    </div>
  </header>
  <div class="layout">
    <aside class="profile" id="profile" aria-labelledby="profile-name">
      <div class="avatar-frame">
        <img id="avatar" alt="" hidden width="170" height="170">
        <div id="avatar-fallback" role="img"><span id="initials">JC</span></div>
      </div>
      <div class="profile-copy">
        <h1 id="profile-name" data-name>Jizhe Cheng</h1>
        <p id="affiliation" class="affiliation"></p>
        <p id="tagline" class="tagline"></p>
      </div>
      <div class="profile-details" id="contact">
        <p id="location" class="location"></p>
        <div id="contact-links" class="social-links"></div>
        <p id="contact-empty" class="muted" data-i18n="contactEmpty">Contact details coming soon.</p>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <details open class="section" id="about">
        <summary><h2 data-i18n="about">About</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content"><p id="intro"></p><p id="about-text"></p><div class="interests"><h3 data-i18n="interests">Interests</h3><ul id="interests"></ul></div></div>
      </details>
      <details open class="section" id="news">
        <summary><h2 data-i18n="news">News</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content"><ul id="news-list" class="news-list"></ul></div>
      </details>
      <details open class="section" id="projects">
        <summary><h2 data-i18n="projects">Projects</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content" id="project-list"></div>
      </details>
      <details open class="section" id="background">
        <summary><h2 data-i18n="background">Education</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content" id="education-list"></div>
      </details>
      <details open class="section" id="experience">
        <summary><h2 data-i18n="experience">Experience</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content" id="experience-list"></div>
      </details>
      <footer><span>© <span id="year"></span> <span data-name>Jizhe Cheng</span></span><span data-i18n="homepage">Personal homepage</span></footer>
      <noscript>Enable JavaScript to display the profile content.</noscript>
    </main>
  </div>
</body>
</html>
