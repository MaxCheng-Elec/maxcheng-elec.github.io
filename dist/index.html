<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Personal homepage: about, projects and background.">
  <meta name="theme-color" content="#fafafa">
  <title>Personal homepage</title>
  <link rel="stylesheet" href="style.css">
  <script src="profile.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <header class="topbar">
    <button id="nav-toggle" aria-expanded="true" aria-controls="sidebar" aria-label="Hide navigation"><span aria-hidden="true">☰</span><span data-i18n="navigation">Navigation</span></button>
    <div class="header-tools"><span class="site-label" data-i18n="siteLabel">PERSONAL / HOMEPAGE</span>
      <label class="language-control"><span class="sr-only" data-i18n="language">Language</span>
        <select id="language-select">
          <option value="en" lang="en">English</option>
          <option value="zh" lang="zh-CN">中文</option>
          <option value="de" lang="de">Deutsch</option>
        </select>
      </label></div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav aria-label="Page sections">
        <p class="nav-label" data-i18n="onThisPage">ON THIS PAGE</p>
        <a href="#profile" aria-current="location"><span>01</span><span class="nav-text" data-i18n="overview">Overview</span></a>
        <a href="#about"><span>02</span><span class="nav-text" data-i18n="about">About</span></a>
        <a href="#news"><span>03</span><span class="nav-text" data-i18n="news">News</span></a>
        <a href="#projects"><span>04</span><span class="nav-text" data-i18n="projects">Projects</span></a>
        <a href="#background"><span>05</span><span class="nav-text" data-i18n="background">Background</span></a>
        <a href="#contact"><span>06</span><span class="nav-text" data-i18n="contact">Contact</span></a>
      </nav>
    </aside>
    <main id="main" tabindex="-1">
      <section class="profile" id="profile" aria-labelledby="profile-name">
        <div class="avatar-frame">
          <img id="avatar" alt="" hidden width="128" height="128">
          <div id="avatar-fallback" role="img" aria-label="Profile photo placeholder"><span id="initials">YN</span></div>
        </div>
        <div class="profile-copy">
          <p class="eyebrow" data-i18n="profile">PROFILE</p>
          <h1 id="profile-name" data-name>Your Name</h1>
          <p id="affiliation" class="affiliation"></p>
          <p id="tagline" class="tagline"></p>
          <p id="location" class="location"></p>
        </div>
      </section>
      <details open class="section" id="about">
        <summary><h2 data-i18n="about">About</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content"><p id="intro"></p><p id="about-text"></p><div class="interests"><h3 data-i18n="interests">Interests</h3><ul id="interests"></ul></div></div>
      </details>
      <details open class="section" id="news">
        <summary><h2 data-i18n="news">News</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content"><ul id="news-list" class="news-list"></ul></div>
      </details>
      <details open class="section" id="projects">
        <summary><h2 data-i18n="projects">Projects</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content" id="project-list"></div>
      </details>
      <details open class="section" id="background">
        <summary><h2 data-i18n="background">Background</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content" id="education-list"></div>
      </details>
      <details open class="section" id="contact">
        <summary><h2 data-i18n="contact">Contact</h2><span class="toggle" aria-hidden="true"></span></summary>
        <div class="content"><div id="contact-links"></div><p id="contact-empty" class="muted" data-i18n="contactEmpty">Contact details coming soon.</p></div>
      </details>
      <footer><span>© <span id="year"></span> <span data-name>Your Name</span></span><span data-i18n="homepage">Personal homepage</span></footer>
      <noscript>Enable JavaScript to load profile content. Section folding works without JavaScript.</noscript>
    </main>
  </div>
</body>
</html>
